<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wiki Mario Debug</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
body{margin:0}
:root{
  --bg:#f3f6fb; --surface:#ffffff; --surface-2:#eaf0fa; --ink:#18203a; --muted:#56627d;
  --line:#d9e1ee; --accent:#2c5bd0; --accent-soft:#e3ebfd; --sky:#5c94fc;
  --brick:#b53120; --coin:#e0a800;
  --easy:#1f8a4c; --easy-bg:#e2f5ea; --mid:#a86400; --mid-bg:#fdf0d8; --hard:#c0321f; --hard-bg:#fde6e2;
  --code-bg:#eef2f9;
  --pixel:"Press Start 2P", ui-monospace, monospace;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1321; --surface:#151c2e; --surface-2:#1b2439; --ink:#e4e9f4; --muted:#9aa5bd;
    --line:#29334b; --accent:#86a9ff; --accent-soft:#1e2a4a; --sky:#5c94fc;
    --brick:#e0634f; --coin:#f2c230;
    --easy:#5fd08f; --easy-bg:#15301f; --mid:#f0b453; --mid-bg:#33260f; --hard:#ff8a76; --hard-bg:#3a1a15;
    --code-bg:#1b2439;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1321; --surface:#151c2e; --surface-2:#1b2439; --ink:#e4e9f4; --muted:#9aa5bd;
  --line:#29334b; --accent:#86a9ff; --accent-soft:#1e2a4a; --sky:#5c94fc;
  --brick:#e0634f; --coin:#f2c230;
  --easy:#5fd08f; --easy-bg:#15301f; --mid:#f0b453; --mid-bg:#33260f; --hard:#ff8a76; --hard-bg:#3a1a15;
  --code-bg:#1b2439;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--sky);color:#fff;
  border-bottom:4px solid var(--brick)}
.topbar-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--pixel);font-size:12px;letter-spacing:.04em;color:#fff;text-decoration:none;line-height:1.5;
  text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.brand small{display:block;font-family:var(--sans);font-size:12px;letter-spacing:0;text-shadow:none;opacity:.9;font-weight:500}
.search{margin-left:auto;flex:1 1 220px;max-width:320px}
.search input{width:100%;padding:8px 12px;border-radius:6px;border:2px solid rgba(0,0,0,.15);font:inherit;font-size:14px;
  background:#fff;color:#18203a}

.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:24px 64px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px}
@media (max-width:820px){.wrap{grid-template-columns:1fr;gap:16px}}

nav.side{position:sticky;top:96px;align-self:start;max-height:calc(100vh - 120px);overflow:auto;font-size:14px}
@media (max-width:820px){nav.side{position:static;max-height:none}}
.side h3{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;font-weight:600}
.side h3:first-child{margin-top:0}
.side ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.side a{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:5px;text-decoration:none;color:var(--ink)}
.side a:hover{background:var(--surface-2)}
.side a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .n{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:22px;font-variant-numeric:tabular-nums}
.side a.on .n{color:var(--accent)}
.dot{width:8px;height:8px;border-radius:2px;flex:none;align-self:center}
.dot.easy{background:var(--easy)}.dot.mid{background:var(--mid)}.dot.hard{background:var(--hard)}
.side .empty{color:var(--muted);padding:5px 8px;font-size:13px}
.mobile-nav{display:none}
@media (max-width:820px){
  nav.side{display:none}
  .mobile-nav{display:block}
  .mobile-nav select{width:100%;padding:9px 10px;font:inherit;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
}

article{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:28px 32px 36px;min-width:0}
@media (max-width:600px){article{padding:20px 18px 28px}}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:8px}
.crumbs a{color:var(--muted)}
h1{font-size:28px;line-height:1.25;margin:0 0 6px;text-wrap:balance;font-weight:700}
.lede{color:var(--muted);margin:0 0 20px;max-width:65ch}
h2{font-size:19px;margin:30px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);text-wrap:balance}
p,li{max-width:68ch}
ul.plain{padding-left:20px;margin:8px 0}
ul.plain li{margin:4px 0}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
pre{font-family:var(--mono);font-size:13px;background:var(--code-bg);padding:14px 16px;border-radius:6px;overflow-x:auto;line-height:1.55;margin:10px 0}
pre code{background:none;padding:0}

.infobox{float:right;width:260px;margin:0 0 16px 24px;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:13.5px;background:var(--surface)}
@media (max-width:720px){.infobox{float:none;width:100%;margin:0 0 18px}}
.infobox .ib-head{background:var(--sky);color:#fff;font-family:var(--pixel);font-size:10px;padding:10px 12px;letter-spacing:.04em;line-height:1.6}
.infobox dl{margin:0;display:grid;grid-template-columns:auto 1fr}
.infobox dt,.infobox dd{padding:7px 12px;border-top:1px solid var(--line);margin:0}
.infobox dt{color:var(--muted);font-weight:500}
.infobox dd{text-align:right;font-variant-numeric:tabular-nums}

.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.chip.easy{color:var(--easy);background:var(--easy-bg)}
.chip.mid{color:var(--mid);background:var(--mid-bg)}
.chip.hard{color:var(--hard);background:var(--hard-bg)}

.note{border-left:3px solid var(--coin);background:var(--surface-2);padding:10px 14px;border-radius:0 6px 6px 0;margin:14px 0;max-width:68ch}

ol.steps{padding-left:22px;margin:8px 0}
ol.steps li{margin:5px 0}

.hints{display:grid;gap:10px;margin-top:8px;clear:both}
.hint{border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.hint-top{display:flex;align-items:center;gap:12px;padding:10px 14px;flex-wrap:wrap}
.coins{font-family:var(--pixel);font-size:10px;color:var(--coin);letter-spacing:2px}
.hint-title{font-weight:600}
.hint-cost{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hint-top button{margin-left:auto}
.hint-body{padding:0 14px 12px;border-top:1px dashed var(--line);padding-top:10px}
.hint-body p{margin:0}
.hint-price{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.unlock{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 12px}
.unlock input{flex:1 1 160px;min-width:0;max-width:220px;font-family:var(--mono);font-size:14px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:5px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.unlock .msg{flex-basis:100%;font-size:13px;margin:0;min-height:1em}
.unlock .msg.err{color:var(--hard)}
.hint .tag{margin-left:auto;font-size:12px;font-weight:600;color:var(--easy)}
button.btn{font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:5px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
:root[data-theme="dark"] button.btn{color:#0e1321}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.btn{color:#0e1321}}
button.btn.ghost{background:transparent;color:var(--accent)}
button.btn:disabled{cursor:not-allowed;border-color:var(--line);background:var(--surface-2);color:var(--muted)}
.hint-actions{display:flex;justify-content:flex-end;margin-top:6px}

ul.links{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}
ul.links li{display:flex;gap:8px;align-items:baseline}
ul.links li::before{content:"";width:6px;height:6px;background:var(--brick);flex:none;transform:translateY(-2px)}
.host{font-family:var(--mono);font-size:12px;color:var(--muted)}

.tablewrap{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
th{background:var(--surface-2);font-weight:600;font-size:13px}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:36px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.pager a{text-decoration:none;display:grid;font-size:14px;max-width:48%}
.pager a small{color:var(--muted);font-size:12px}
.pager .next{text-align:right;margin-left:auto}

.grid-missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:12px 0}
.mcard{display:grid;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--ink);background:var(--surface)}
.mcard:hover{border-color:var(--accent)}
.mcard .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lore{border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:18px 20px;margin:0 0 8px}
.lore h2{margin-top:0;border:none;padding:0}
.lore p{margin:10px 0}
.lore .alert{font-family:var(--pixel);font-size:11px;line-height:1.7;color:var(--brick);margin:0}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0}
.team{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.team .ico{font-size:22px;line-height:1}
.team b{display:block;font-weight:600}
.team small{color:var(--muted);font-size:12px}
.keys td:first-child{white-space:nowrap}
kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;background:var(--surface)}
.mcard .num{font-family:var(--pixel);font-size:10px;color:var(--muted)}
.mcard b{font-weight:600;line-height:1.35}
.mcard .file{font-family:var(--mono);font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.mcard,.side a{transition:background .12s,border-color .12s}}
</style>

</head>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#inicio">MARIO DEBUG<br>CHALLENGE<small>Wiki das missões · Liga Acadêmica</small></a>

</div>

const md = s => esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
const id = m => "missao-" + String(m.n).padStart(2,"0");
const chip = l => `<span class="chip ${l}">${LEVEL[l].label}</span>`;

// Códigos já digitados neste navegador; o texto das dicas só existe depois de decifrado
let codes = {};
try { codes = JSON.parse(localStorage.getItem("wiki-mario-codigos") || "{}"); } catch(e){ codes = {}; }
const saveCodes = () => { try { localStorage.setItem("wiki-mario-codigos", JSON.stringify(codes)); } catch(e){} };
const opened = {};
const slotKey = (n,i) => n + "-" + (i+1);

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const norm = c => c.toUpperCase().replace(/[^A-Z0-9]/g, "");
async function decrypt(slot, code){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(norm(code)), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(slot.s), iterations:slot.n, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(slot.i)}, key, b64(slot.c));
  return new TextDecoder().decode(plain);
}
async function restoreCodes(){
  for (const [k, code] of Object.entries(codes)) {
    const [n, i] = k.split("-").map(Number);
    try { opened[k] = await decrypt(ENC[n][i-1], code); } catch(e){ delete codes[k]; }
  }
  saveCodes(); render();
}

const PAGES = ["inicio","regras","codigo", ...M.map(id)];

function buildNav(filter){
  const f = (filter||"").trim().toLowerCase();
  const match = m => !f || [m.title,m.file,m.resumo,LEVEL[m.lvl].label,"#"+m.n].join(" ").toLowerCase().includes(f);
  const cur = current();
  const item = (href,label,extra="") => `<li><a href="#${href}" class="${cur===href?"on":""}">${extra}<span>${label}</span></a></li>`;
  let html = "";
  if(!f){
    html += `<h3>Wiki</h3><ul>${item("inicio","Página inicial")}${item("regras","Regras e pontuação")}${item("codigo","Mapa do código")}</ul>`;
  }
  for(const l of ["easy","mid","hard"]){
    const list = M.filter(m=>m.lvl===l && match(m));
    if(!list.length) continue;
    html += `<h3>${LEVEL[l].label} · ${LEVEL[l].pts} pts</h3><ul>${list.map(m=>item(id(m),esc(m.title),`<span class="n">#${m.n}</span>`)).join("")}</ul>`;
  }
  if(f && !M.some(match)) html += `<p class="empty">Nenhuma missão encontrada para “${esc(filter)}”.</p>`;
  document.getElementById("side").innerHTML = html;

  const sel = document.getElementById("msel");
  sel.innerHTML = `<option value="inicio">Página inicial</option><option value="regras">Regras e pontuação</option><option value="codigo">Mapa do código</option>` +
    M.map(m=>`<option value="${id(m)}">#${m.n} · ${esc(m.title)}</option>`).join("");
  sel.value = cur;
}

function current(){
  const h = location.hash.replace("#","");
  return PAGES.includes(h) ? h : "inicio";
}

function pageMissao(m){
  const L = LEVEL[m.lvl];
  const key = id(m);
  const names = ["Dica 1 · leve","Dica 2 · média","Dica 3 · forte"];
  const got = [0,1,2].filter(i => opened[slotKey(m.n,i)]).length;
  const hints = [0,1,2].map(i=>{
    const k = slotKey(m.n,i), txt = opened[k];
    return `<div class="hint">
      <div class="hint-top"><span class="coins" aria-hidden="true">${"●".repeat(i+1)}</span><span class="hint-title">${names[i]}</span><span class="hint-price">🪙 ${PRECO[i]}</span>${txt ? `<span class="tag">Desbloqueada</span>` : ""}</div>
      ${txt ? `<div class="hint-body"><p>${md(txt)}</p></div>` : `<form class="unlock" data-slot="${k}">
        <input id="cod-${k}" name="codigo" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX" aria-label="Código da ${names[i]}">
        <button class="btn" type="submit">Desbloquear</button>
        <p class="msg" aria-live="polite"></p>
      </form>`}
    </div>`;
  }).join("");
  const i = M.indexOf(m), prev = M[i-1], next = M[i+1];
  return `<div class="crumbs"><a href="#inicio">Wiki</a> › <a href="#codigo">${L.label}</a> › Missão #${m.n}</div>
  <aside class="infobox">
    <div class="ib-head">MISSÃO #${String(m.n).padStart(2,"0")}</div>
    <dl>
      <dt>Arquivo</dt><dd><code>${m.file}</code></dd>
      <dt>Dificuldade</dt><dd>${chip(m.lvl)}</dd>
      <dt>Valor</dt><dd>${L.pts} pts</dd>
      <dt>Dicas</dt><dd>🪙 ${PRECO.join(" / ")}</dd>
      <dt>Desbloqueadas</dt><dd>${got} de 3</dd>
    </dl>
  </aside>
  <h1>${esc(m.title)}</h1>
  <p class="lede">${md(m.resumo)}</p>
  ${m.twin ? `<div class="note">${md(m.twin)}</div>` : ""}
  <h2>Como reproduzir</h2>
  <ol class="steps">${m.repro.map(s=>`<li>${md(s)}</li>`).join("")}</ol>
  <h2>Dicas</h2>
  <p style="color:var(--muted);margin-top:0">Compre a dica com a comissão e digite o código recebido. As dicas são vendidas em ordem.</p>
  <div class="hints">${hints}</div>
  <div class="pager">
    ${prev ? `<a href="#${id(prev)}"><small>← Missão anterior</small>#${prev.n} · ${esc(prev.title)}</a>` : `<a href="#inicio"><small>← Voltar</small>Página inicial</a>`}
    ${next ? `<a class="next" href="#${id(next)}"><small>Próxima missão →</small>#${next.n} · ${esc(next.title)}</a>` : ""}
  </div>`;
}

function render(){
  const cur = current();
  const page = document.getElementById("page");
  const m = M.find(x=>id(x)===cur);
  page.innerHTML = m ? pageMissao(m) : cur==="regras" ? pageRegras() : cur==="codigo" ? pageCodigo() : pageHome();
  buildNav(document.getElementById("q").value);
}

document.addEventListener("submit", async e=>{
  const f = e.target.closest("form.unlock");
  if(!f) return;
  e.preventDefault();
  const k = f.dataset.slot, [n, i] = k.split("-").map(Number);
  const input = f.querySelector("input"), msg = f.querySelector(".msg"), btn = f.querySelector("button");
  const code = input.value.trim();
  msg.className = "msg";
  if(!norm(code)){ msg.textContent = "Digite o código que a comissão entregou."; msg.classList.add("err"); input.focus(); return; }
  btn.disabled = true; msg.textContent = "Conferindo o código…";
  try {
    opened[k] = await decrypt(ENC[n][i-1], code);
    codes[k] = code; saveCodes(); render();
  } catch(err){
    btn.disabled = false;
    msg.textContent = "Código inválido para esta dica. Confira as letras e os números e tente de novo.";
    msg.classList.add("err"); input.select();
  }
});
window.addEventListener("hashchange", ()=>{ render(); window.scrollTo(0,0); });
document.getElementById("q").addEventListener("input", e=>buildNav(e.target.value));
document.getElementById("msel").addEventListener("change", e=>{ location.hash = e.target.value; });
render();
restoreCodes();
</script>
